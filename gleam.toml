name = "dream_model"
version = "1.0.0"
description = "Typed PostgreSQL models for Gleam, written from your SQL files"
licences = ["Apache-2.0"]
gleam = ">= 1.19.2"
repository = { type = "github", user = "TrustBound", repo = "dream_model" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream_model" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream_model" },
]

# The public API of dream_model is the command `gleam run -m dream_model`.
# Every other module is the engine of the generator. Its API can change in
# any release.
internal_modules = ["dream_model/postgres", "dream_model/postgres/*", "dream_model/nullability", "dream_model/nullability/*", "dream_model/generator", "dream_model/generator/*", "dream_model/command"]

[documentation]
pages = [
    { title = "Guides", path = "guides/index.html", source = "./docs/guides/index.md" },
    { title = "Getting started", path = "guides/getting-started.html", source = "./docs/guides/getting-started.md" },
    { title = "Hints", path = "guides/hints.html", source = "./docs/guides/hints.md" },
    { title = "Why is this column Option?", path = "guides/why-option.html", source = "./docs/guides/why-option.md" },
    { title = "Types", path = "guides/types.html", source = "./docs/guides/types.md" },
    { title = "Errors", path = "guides/errors.html", source = "./docs/guides/errors.md" },
    { title = "CI and schema drift", path = "guides/ci-and-schema-drift.html", source = "./docs/guides/ci-and-schema-drift.md" },
    { title = "Command reference", path = "guides/command-reference.html", source = "./docs/guides/command-reference.md" },
]

[erlang]
extra_applications = ["crypto", "ssl"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
filepath = ">= 1.1.0 and < 2.0.0"
tom = ">= 2.0.0 and < 3.0.0"
dream_postgres = ">= 2.1.0 and < 3.0.0"

[dev-dependencies]
dream_test = ">= 3.0.0 and < 4.0.0"
dream_snippets = ">= 1.0.0 and < 2.0.0"

[tools.dream_snippets]
checked_from_version = "1.0.0"
tested_files = ["test", ".github", "scripts", "gleam.toml", "docker-compose.yml", "e2e"]
